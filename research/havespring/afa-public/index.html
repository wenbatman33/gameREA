    <script>
    (function () {
        window.addEventListener('beforeGameRun', beforeGameRun, { once: true });

        function beforeGameRun() {
            const setting = cc.settings._settings.settings;
            function brandFinish() {
                window.dispatchEvent(new Event('brandFinish'));
            }

            if (setting.BrandLogoUrl) {
                const splash = document.getElementById('brandSplash');
                if (splash) {
                    splash.classList.remove('hide');
                    if (setting.BrandLogoBackgroundColor) {
                        splash.style['background-color'] = setting.BrandLogoBackgroundColor;
                    }
                    if (setting.BrandLogoUrl.endsWith('.mp4')) {
                        document.getElementById('brandLogoVideoSource').src = setting.BrandLogoUrl;
                        document.getElementById('brandLogoVideo').loop = setting.BrandLogoVideoLoop !== undefined ? setting.BrandLogoVideoLoop : true;
                        document.getElementById('brandLogoVideo').load();
                        document.getElementById('brandLogo').classList.add('hide');
                    } else {
                        document.getElementById('brandLogo').src = setting.BrandLogoUrl;
                        document.getElementById('brandLogoVideo').classList.add('hide');
                    }

                    setTimeout(
                        () => {
                            splash.remove();
                            brandFinish();
                        },
                        Math.max(0, setting.BrandLogoActiveDuration),
                    );
                }
            } else {
                brandFinish();
            }
        }
    })();
</script>

    <script>
    (function () {
        const offsetHeight = 300;
        const agent = window.navigator.userAgent.toLowerCase();
        const isMobile = agent && /mobile|android|iphone|ipad/.test(agent);
        const isIOS = agent && /iphone|ipad|ipod|ios|os/.test(agent);
        const isIframe = !!window.parent && window !== window.parent;
        const isAndroid = agent && /android/.test(agent);
        const isIOSChrome = navigator.userAgent.indexOf('CriOS') >= 0;
        const body = document.querySelector('body');
        const html = document.querySelector('html');
        const gameCanvas = document.querySelector('#GameCanvas');
        const gameCanvasMask = document.querySelector('.GameCanvasMask');
        const closeBtn = document.querySelector('.closeBtn');
        const enableFullScreen = (getParamSearch('iosFullscreen') ?? 'true') === 'true';
        if (isAndroid) {
            const originDPR = window.devicePixelRatio;
            if (originDPR >= 2) {
                window.devicePixelRatio = 2;
            } else if (originDPR >= 1.5) {
                window.devicePixelRatio = 1.5;
            } else {
                window.devicePixelRatio = 1;
            }
        }
        if (isIOS && !isIframe) {
            const area1 = document.getElementById('scrollArea1');
            const area2 = document.getElementById('scrollArea2');
            area1.classList.remove('hide');
            area2.classList.remove('hide');
            html.scroll(0, offsetHeight);
            gameCanvas.style['bottom'] = '0px';
        } else {
            const gameDiv = document.getElementById('GameDiv');
            gameDiv.style['position'] = 'absolute';
            document.querySelector('body').style['overflow'] = 'hidden';
        }

        window.addEventListener('brandFinish', () => {
            initEvent();
        });

        function autoScroll() {
            if (!isIOSChrome) {
                window.scroll(0, offsetHeight);
                body.scroll(0, offsetHeight);
            }
            checkToolbarStatus();
            setTimeout(() => {
                if (!isIOSChrome) {
                    window.scroll(0, offsetHeight);
                    body.scroll(0, offsetHeight);
                }
                checkToolbarStatus();
            }, 500);
        }

        function initEvent() {
            if (isIOS && !isIframe) {
                addEventListener('scroll', (e) => {
                    autoScroll();
                });
                body.addEventListener('scroll', () => {
                    autoScroll();
                });
                addEventListener('resize', (e) => {
                    autoScroll();
                });
                addEventListener('orientationchange', (e) => {
                    autoScroll();
                });
                closeBtn.addEventListener('click', () => {
                    hideGameCanvasMask();
                });
                window.scroll(0, offsetHeight);
                body.scroll(0, offsetHeight);
                checkToolbarStatus();
            }
        }

        function updateGameDivBottom() {
            const orientation = cc.settings.querySettings('screen', 'orientation');
            const gameDivstyle = document.querySelector('#GameDiv').style;
            const gestureIconstyle = document.querySelector('.gestureIcon').style;
            const isBrowserLandscape = window.innerWidth > window.innerHeight;
            if (isMobile || isIOS) {
                const isFrameRotated = isMobile && ((isBrowserLandscape && orientation === 'portrait') || (!isBrowserLandscape && orientation === 'landscape'));
                if (isFrameRotated && orientation !== 'auto') {
                    if (window.orientation === 90) {
                        gameDivstyle['bottom'] = `${-window.innerWidth + Math.random() * 0.01}px`;
                        gestureIconstyle['transform'] = 'rotate(90deg)';
                    } else {
                        gameDivstyle['bottom'] = `${window.innerHeight - window.innerWidth + Math.random() * 0.01}px`;
                        gestureIconstyle['transform'] = 'rotate(-90deg)';
                    }
                } else {
                    gameDivstyle['bottom'] = '0px';
                    gestureIconstyle['transform'] = 'rotate(0)';
                }
            }
        }

        function checkToolbarStatus() {
            const scrollTop = html.scrollTop || window.scrollY || body.scrollTop;
            // 20px為避免滑動已接近完整全螢幕 但尚未達到的容許範圍
            if (document.querySelector('.testHeightObject').clientHeight - window.innerHeight > 20 || scrollTop < offsetHeight) {
                // 尚未最小化工具列 或是還沒滑動到正確位置
                if (isIOSChrome) {
                    if (gameCanvasMask.style['display'] === 'none') {
                        window.scroll(0, offsetHeight);
                    }
                }
                gameCanvasMask.style['display'] = enableFullScreen ? 'block' : 'none';
                closeBtn.style['display'] = gameCanvasMask.style['display'];
                body.style['overflow'] = enableFullScreen ? 'scroll' : 'hidden';
            } else {
                hideGameCanvasMask();
            }
            for (let i = 0; i <= 10; i++) {
                setTimeout(() => {
                    updateGameDivBottom();
                }, i * 100);
            }
        }

        function hideGameCanvasMask() {
            gameCanvasMask.style['display'] = 'none';
            body.style['overflow'] = 'hidden';
            closeBtn.style['display'] = 'none';
        }

        function getParamSearch(param) {
            return new URL(document.location.href).searchParams.get(param);
        }
    })();
</script>

    <script>
    (function () {
        window.addEventListener('beforeGameRun', beforeGameRun, { once: true });

        function beforeGameRun() {
            const setting = cc.settings._settings.settings;
            if (setting.FooterUrl) {
                const footer = document.getElementById('footer');
                if (footer) {
                    footer.classList.remove('hide');
                    footer.src = setting.FooterUrl;
                }
            }
        }
    })();

    window.enterGame = function () {
        document.getElementById('footer')?.remove();
    };
</script>

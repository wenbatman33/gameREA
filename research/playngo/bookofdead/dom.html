html {
	position: absolute;
}

body {
	font-family: "Segoe UI", sans-serif;
	overflow: hidden;
}

span {
	font-style: italic;
}

table,
h1,
h2 {
	margin: auto;
	text-align: center;
}

.side-column {
	height: 100%;
	display: flex;
	flex-direction: row;
}

.grid-cell,
.side-column {
	display: block;
}

#game-grid {
	display: flex;
	flex-direction: row;
	width: 100%;
	height: 100%;
	position: fixed;
	top: 0;
	left: 0;
}

@media (orientation: landscape) {
	@supports (width: -webkit-fill-available) {
		#game-grid {
			height: calc(100% - env(safe-area-inset-bottom, 0px));
		}
	}
}

#game-column {
	min-width: 0;
	display: flex;
	flex-direction: column;
	flex: 1 1 auto;
	width: 100%;
	height: 100%;
}

#game-row-top {
	display: flex;
	flex-direction: column;
}

#game-row-bottom {
	display: flex;
	flex-direction: column;
}

#gameWrapper,
#pngCasinoGame {
	min-width: 0;
	flex: 1 1 auto;
	position: relative;
	height: 50%;
}

/* Makes Player Protection Sweden buttons on the same row */
.pps-top-bar-mobile {
	display: flex !important;
	flex-wrap: wrap;
}

#pps-clock {
	display: flex;
	align-items: center;
	top: 0;
	justify-content: end;
	margin-left: auto;
}

.pngFadeOutAnim {
	animation: pngSwipeFadeOut 200ms ease-in;
	animation-fill-mode: forwards;
	-webkit-animation-fill-mode: forwards;
}
/***HAND ANIMATION***/
@keyframes swipeHandScrollUp {
	0% {
		top: 50vh;
		opacity: 0;
	}

	20% {
		top: 50vh;
		opacity: 1;
	}

	40% {
		top: 30vh;
		opacity: 1;
	}

	60% {
		top: 30vh;
		opacity: 0
	}
	/*end of animation here, remaining percentage is the delay*/
	80% {
		top: 30vh;
		opacity: 0
	}
}

@keyframes pngSwipeFadeOut {
	0% {
		display: block;
		opacity: 1
	}

#pngProgressContainer {
    height: 1vw;
    width: 26%;
    bottom: 14%;
    background-color: black;
    border-radius: 2px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25) inset;
}

#pngProgressBar {
    height: 100%;
    position: absolute;
    width: 0%;
    background: #0061a7;
    background-image: -moz-linear-gradient(right, #3192d8 0px, #0061a7 5vw, #0061a7 100%);
    background-image: -o-linear-gradient(right, #3192d8 0px, #0061a7 5vw, #0061a7 100%);
    background-image: -ms-linear-gradient(right, #3192d8 0px, #0061a7 5vw, #0061a7 100%);
    background-image: linear-gradient(to right, #3192d8 0px, #0061a7 5vw, #0061a7 100%);
    background-image: -webkit-linear-gradient(right, #3192d8 0px, #0061a7 5vw, #0061a7 100%);
    box-shadow: inset 0px 0px 0px 2px #000000;
    -webkit-box-shadow: inset 0px 0px 0px 2px #000000;
    -moz-box-shadow: inset 0px 0px 0px 2px #000000;
    -o-box-shadow: inset 0px 0px 0px 2px #000000;
}

#pngProgressBar.pngReconnect {
    background: -webkit-linear-gradient(right, #0061a7, #8ed0ff, #0061a7);
    background: linear-gradient(to 270deg, #0061a7, #8ed0ff, #0061a7);
    background-size: 500% 100%;
    -webkit-animation: bounceanim 2s ease-in-out infinite;
    animation: bounceanim 2s ease-in-out infinite;
}

#pngProgressBar.pngConnecting {
    -webkit-transition: all 500ms cubic-bezier(0.245, 0.435, 0.875, 0.660);
    -moz-transition: all 500ms cubic-bezier(0.245, 0.435, 0.875, 0.660);
    -o-transition: all 500ms cubic-bezier(0.245, 0.435, 0.875, 0.660);
    transition: all 500ms cubic-bezier(0.245, 0.435, 0.875, 0.660); /* custom */
    -webkit-transition-timing-function: cubic-bezier(0.245, 0.435, 0.875, 0.660);
    -moz-transition-timing-function: cubic-bezier(0.245, 0.435, 0.875, 0.660);
    -o-transition-timing-function: cubic-bezier(0.245, 0.435, 0.875, 0.660);
    transition-timing-function: cubic-bezier(0.245, 0.435, 0.875, 0.660); /* custom */
}

.pngBall {
    display: block;
    background-color: #2d87ca;
    width: 12px;
    height: 12px;
    border-radius: 6px;
}

#pngFirst {
    -webkit-animation-timing-function: cubic-bezier(0.5, 0.3, 0.9, 0.9);
    -webkit-animation-name: rotate;
    -webkit-animation-duration: 2s;
    -webkit-animation-iteration-count: infinite;
    -webkit-transform-origin: 6px 30px;
    -moz-animation-timing-function: cubic-bezier(0.5, 0.3, 0.9, 0.9);
    -moz-animation-name: rotate;
    -moz-animation-duration: 2s;
    -moz-animation-iteration-count: infinite;
    -moz-transform-origin: 6px 30px;
    animation-timing-function: cubic-bezier(0.5, 0.3, 0.9, 0.9);
    animation-name: rotate;
    animation-duration: 2s;
    animation-iteration-count: infinite;
    -ms-transform-origin: 6px 30px;
}

#pngSecond {
    -webkit-animation-timing-function: cubic-bezier(0.5, 0.5, 0.9, 0.9);
    -webkit-animation-name: rotate;
    -webkit-animation-duration: 2s;
    -webkit-animation-iteration-count: infinite;
    -webkit-transform-origin: 6px 30px;
    -moz-animation-timing-function: cubic-bezier(0.5, 0.5, 0.9, 0.9);
    -moz-animation-name: rotate;
    -moz-animation-duration: 2s;
    -moz-animation-iteration-count: infinite;
    -moz-transform-origin: 6px 30px;
    animation-timing-function: cubic-bezier(0.5, 0.5, 0.9, 0.9);
    animation-name: rotate;
    animation-duration: 2s;
    animation-iteration-count: infinite;
    -ms-transform-origin: 6px 30px;
}

#pngThird {
    -webkit-animation-timing-function: cubic-bezier(0.5, 0.7, 0.9, 0.9);
    -webkit-animation-name: rotate;
    -webkit-animation-duration: 2s;
    -webkit-animation-iteration-count: infinite;
    -webkit-transform-origin: 6px 30px;
    -moz-animation-timing-function: cubic-bezier(0.5, 0.7, 0.9, 0.9);
    -moz-animation-name: rotate;
    -moz-animation-duration: 2s;
    -moz-animation-iteration-count: infinite;
    -moz-transform-origin: 6px 30px;
    animation-timing-function: cubic-bezier(0.5, 0.7, 0.9, 0.9);
    animation-name: rotate;
    animation-duration: 2s;
    animation-iteration-count: infinite;
    -ms-transform-origin: 6px 30px;
}

/** MOBILE PORTRAIT **/
@media all and (orientation:portrait) {
    #pngProgressContainer {
        width: 45%;
        height: 2vw;
    }
}

/** MOBILE LANDSCAPE **/
@media all and (orientation:landscape) {
    #pngLogoWrapper {
        width: 10vw;
        height: 3vw;
        bottom: env(safe-area-inset-bottom, 3%);
        max-width: 100%;
    }
}

/** DESKTOP GENERAL**/
@media only screen and (min-width: 768px) {
    #pngProgressContainer {
        height: 0.7em;
        bottom: 15%;
        opacity: 1;
    }
}

/** DESKTOP PORTRAIT **/
@media only screen and (min-width: 768px) and (orientation: portrait) {
    #pngLogoWrapper {
        width: 30vw;
        height: calc(30vw * 0.4);
    }
}

/** DESKTOP LANDSCAPE **/
@media only screen and (min-width: 768px) and (orientation: landscape) {
    #pngLogoWrapper {
        width: calc(6.5vh * 3);
        height: 6.5vh;
        bottom: calc(1% + env(safe-area-inset-bottom, 0px));

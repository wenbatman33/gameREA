name: Publish browser demos
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build release with normal audio
        run: python3 build_static.py --output web-build
      - name: Verify browser fake-backend contracts and asset package
        run: python3 test_static.py web-build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web-build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static browser demos
        id: deployment
        uses: actions/deploy-pages@v4
